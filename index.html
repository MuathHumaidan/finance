<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F3F4F8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="المدير المالي">
<meta name="color-scheme" content="light">
<title>المدير المالي</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<style>
/* الخط: IBM Plex Sans Arabic (رخصة OFL في FONT-LICENSE.txt) — محفوظ مع التطبيق ويشتغل بدون إنترنت */
@font-face{font-family:'Plex';font-weight:400;font-display:swap;src:url(plex-arabic-400.woff2) format('woff2');unicode-range:U+0600-06FF,U+0750-077F,U+0870-08FF,U+200C-200E,U+2010-2011,U+204F,U+2E41,U+FB50-FDFF,U+FE70-FEFC}
@font-face{font-family:'Plex';font-weight:500;font-display:swap;src:url(plex-arabic-500.woff2) format('woff2');unicode-range:U+0600-06FF,U+0750-077F,U+0870-08FF,U+200C-200E,U+2010-2011,U+204F,U+2E41,U+FB50-FDFF,U+FE70-FEFC}
@font-face{font-family:'Plex';font-weight:700;font-display:swap;src:url(plex-arabic-700.woff2) format('woff2');unicode-range:U+0600-06FF,U+0750-077F,U+0870-08FF,U+200C-200E,U+2010-2011,U+204F,U+2E41,U+FB50-FDFF,U+FE70-FEFC}
@font-face{font-family:'Plex';font-weight:400;font-display:swap;src:url(plex-latin-400.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'Plex';font-weight:500;font-display:swap;src:url(plex-latin-500.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'Plex';font-weight:700;font-display:swap;src:url(plex-latin-700.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
:root{
  --pri:#4B5CF0; --pri-2:#3A49D6; --pri-soft:#EEF0FE; --pri-ink:#2F3BB5;
  --pos:#15803D; --pos-soft:#E3F5EA; --neg:#D93F3C; --neg-soft:#FDECEC;
  --warn:#F0A020; --warn-soft:#FFF5E0; --warn-ink:#8A5A00;
  --ink:#14161F; --ink-2:#5B6170; --ink-3:#969CAB; --line:#ECEEF3; --line-2:#DDE0E8;
  --bg:#F3F4F8; --card:#FFFFFF; --chip:#F2F3F7;
  --r:24px; --r-s:16px; --gap:14px;
  --shadow:0 1px 2px rgba(20,22,31,.04),0 6px 20px rgba(20,22,31,.05);
  --safe-b: env(safe-area-inset-bottom, 0px); --safe-t: env(safe-area-inset-top, 0px);
  color-scheme: light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Plex',-apple-system,"SF Arabic","Segoe UI","Noto Sans Arabic",Tahoma,sans-serif;font-size:15px;line-height:1.55;-webkit-text-size-adjust:100%}
body{min-height:100vh;padding-bottom:calc(104px + var(--safe-b))}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate;display:inline-block}
.cur{font-size:.62em;font-weight:500;color:inherit;opacity:.7;margin-inline-start:4px}
a{color:var(--pri-ink);text-decoration:none;font-weight:600}
svg.i{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
/* رأس الصفحة */
.top{padding:calc(14px + var(--safe-t)) 18px 4px;max-width:1100px;margin:0 auto}
.top .ttl{display:flex;align-items:center;gap:10px;min-height:44px}
.top h1{font-size:30px;margin:0;font-weight:700;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.2px}
.top .back{background:var(--card);border:0;border-radius:50%;width:40px;height:40px;display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow);cursor:pointer;color:var(--ink)}
.pill{background:var(--card);border:0;color:var(--pri-ink);border-radius:999px;padding:8px 14px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;box-shadow:var(--shadow)}
body.v-home .top{display:none}
main{max-width:1100px;margin:0 auto;padding:10px 16px 24px}
/* الشريط السفلي العائم */
.nav{position:fixed;bottom:calc(10px + var(--safe-b));left:12px;right:12px;max-width:620px;margin:0 auto;z-index:30;background:rgba(255,255,255,.96);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-radius:30px;display:flex;justify-content:space-between;padding:7px;box-shadow:0 8px 30px rgba(20,22,31,.12)}
.nav button{flex:1;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;font-weight:500;color:var(--ink);padding:7px 2px;border-radius:22px;cursor:pointer}
.nav button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.nav button.on{background:var(--chip);color:var(--pri)}
.nav button.on span{color:var(--ink);font-weight:700}
.fab{position:fixed;inset-inline-start:18px;bottom:calc(92px + var(--safe-b));z-index:31;width:58px;height:58px;border-radius:50%;border:0;background:var(--pri);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 24px rgba(75,92,240,.38);cursor:pointer}
.fab svg{width:28px;height:28px;stroke:#fff;stroke-width:2.2}
@media (min-width:700px){ .fab{inset-inline-start:calc(50% - 350px)} }
/* بطاقات */
.card{background:var(--card);border-radius:var(--r);padding:18px;margin-bottom:var(--gap);box-shadow:var(--shadow)}
.card h2{font-size:17px;margin:0 0 12px;font-weight:700;display:flex;align-items:center;gap:8px}
.card h2 .sp{flex:1}
.card h2.soft{color:var(--ink-2);font-weight:500;font-size:16px}
.muted{color:var(--ink-3);font-size:13px}
.small{font-size:12.5px}
.pos{color:var(--pos)} .neg{color:var(--neg)} .neu{color:var(--ink-2)} .warn-t{color:var(--warn-ink)}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:var(--gap)}
.kpis.k5{grid-template-columns:repeat(2,1fr)}
.kpi{background:var(--card);border-radius:var(--r-s);padding:12px 14px;cursor:pointer;box-shadow:var(--shadow);min-width:0}
.kpi .l{font-size:12.5px;color:var(--ink-2);margin-bottom:2px}
.kpi .v{font-size:19px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .s{font-size:11.5px;color:var(--ink-3);margin-top:3px;line-height:1.35}
@media (max-width:520px){ .kpis{grid-template-columns:1fr 1fr} .kpis .kpi.wide{grid-column:1/-1} }
@media (min-width:900px){ .kpis.k5{grid-template-columns:repeat(5,1fr)} .grid2{display:grid;grid-template-columns:1fr 1fr;gap:var(--gap)} .grid2>.card{margin-bottom:0} }
/* الرئيسية */
.hero{background:linear-gradient(160deg,#5566F4 0%,#4352E6 100%);color:#fff;margin:-10px -16px 0;padding:calc(18px + var(--safe-t)) 20px 74px;border-radius:0 0 34px 34px;text-align:center;position:relative}
.hero .hi{font-size:15px;opacity:.9;font-weight:500}
.hero .big{font-size:40px;font-weight:700;line-height:1.2;margin:4px 0 2px;letter-spacing:-.5px}
.hero .big .cur{opacity:.85}
.hero .sub{font-size:13px;opacity:.85}
.hero .gl{display:flex;gap:8px;overflow-x:auto;margin:16px -20px 0;padding:0 20px;scrollbar-width:none}
.hero .gl::-webkit-scrollbar{display:none}
.hero .g{flex:none;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3);border-radius:18px;padding:8px 14px;text-align:start;display:flex;align-items:center;gap:10px;cursor:pointer;color:#fff}
.hero .g .l{font-size:12.5px;opacity:.9;font-weight:600}
.hero .g .v{font-size:15px;font-weight:700}
.hero .g svg.i{width:26px;height:26px;opacity:.95}
.hero .tools{position:absolute;top:calc(12px + var(--safe-t));inset-inline-end:14px;display:flex;gap:8px}
.hero .tools button{background:rgba(255,255,255,.16);border:0;border-radius:50%;width:38px;height:38px;color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer}
.accs{display:flex;gap:12px;overflow-x:auto;margin:-58px -16px var(--gap);padding:4px 16px 10px;position:relative;z-index:2;scrollbar-width:none;scroll-snap-type:x mandatory}
.accs::-webkit-scrollbar{display:none}
.acc{flex:none;width:210px;background:var(--card);border-radius:22px;padding:14px 16px;box-shadow:0 6px 22px rgba(20,22,31,.10);cursor:pointer;scroll-snap-align:start}
.acc .h{display:flex;align-items:center;gap:10px}
.acc .h .m{flex:1;min-width:0}
.acc .n{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acc .d{font-size:12.5px;color:var(--ink-3)}
.acc .bl{font-size:12.5px;color:var(--ink-3);margin-top:14px}
.acc .bv{font-size:20px;font-weight:700}
/* الدوائر والأيقونات */
.ic{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none;position:relative}
.ic svg.i{width:23px;height:23px}
.ic.s{width:36px;height:36px} .ic.s svg.i{width:19px;height:19px}
.ic .mini{position:absolute;bottom:-3px;inset-inline-start:-3px;width:20px;height:20px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.ic .mini svg.i{width:12px;height:12px}
.dir{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:6px;flex:none}
.dir svg.i{width:14px;height:14px;stroke-width:2.2}
.dir.o{background:var(--neg-soft);color:var(--neg)} .dir.n{background:var(--pos-soft);color:var(--pos)} .dir.x{background:var(--chip);color:var(--ink-2)} .dir.w{background:var(--warn-soft);color:var(--warn-ink)}
/* تبويبات الفترة ومربعها */
.tabs{display:flex;background:#E9EBF1;border-radius:18px;padding:4px;margin-bottom:16px}
.tabs button{flex:1;border:0;background:none;padding:9px 6px;border-radius:14px;font-size:15px;font-weight:600;color:var(--ink-2);cursor:pointer}
.tabs button.on{background:#fff;color:var(--pri);box-shadow:0 1px 4px rgba(20,22,31,.08)}
.pbox{display:flex;align-items:stretch;justify-content:center;margin:0 auto 10px;max-width:420px}
.pbox .in{background:#fff;border-radius:18px;box-shadow:0 4px 18px rgba(20,22,31,.08);display:flex;align-items:stretch;overflow:hidden;min-width:0}
.pbox .arr{border:0;background:none;width:46px;display:flex;align-items:center;justify-content:center;color:var(--pri);cursor:pointer}
.pbox .arr:disabled{color:var(--line-2);cursor:default}
.pbox .mid{padding:8px 14px;text-align:center;border-inline:1px solid var(--line);cursor:pointer;min-width:0}
.pbox .mid.solo{border:0}
.pbox .rg{font-size:13px;color:var(--ink-2);white-space:nowrap}
.pbox .tot{font-size:24px;font-weight:700;display:flex;align-items:center;gap:8px;justify-content:center}
.pbox .x{border:0;background:var(--chip);border-radius:50%;width:22px;height:22px;font-size:13px;line-height:1;color:var(--ink-3);cursor:pointer}
.cmp{display:flex;justify-content:center;margin:6px 0 14px}
.cmp span.p{display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:7px 16px;font-size:14.5px;font-weight:700}
.cmp .dn{background:var(--pos-soft);color:var(--pos)} .cmp .up{background:var(--warn-soft);color:var(--warn-ink)} .cmp .na{background:var(--chip);color:var(--ink-2);font-weight:500;font-size:13px}
.cmp svg.i{width:18px;height:18px}
/* الرسم */
.chart{position:relative;margin:4px 0 2px}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .bar{cursor:pointer}
.chart text{font-family:inherit;font-size:11px;fill:var(--ink-3)}
.chart .dl{font-size:12.5px;fill:var(--ink-2)}
.chart .dl.on{fill:var(--pri);font-weight:700}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;justify-content:center;margin:8px 0 2px;font-size:12px;color:var(--ink-2)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:5px;vertical-align:-1px}
/* قائمة الأرقام */
.rows .r{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line);cursor:pointer}
.rows .r:last-child{border-bottom:0}
.rows .r .l{flex:1;color:var(--ink-2);font-size:15px}
.rows .r .s{font-size:12px;color:var(--ink-3)}
.rows .r .v{font-size:18px;font-weight:700}
.rows .r.sub .v{font-size:16px;font-weight:600}
/* وين راحت الدراهم */
.where .w{display:flex;align-items:center;gap:10px;margin-bottom:10px;cursor:pointer}
.where .bar{border-radius:18px;padding:10px 14px;display:flex;align-items:center;gap:10px;min-width:min-content;flex:none;max-width:calc(100% - 100px)}
.where .bar .m{min-width:0}
.where .bar .t{font-weight:700;font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink)}
.where .bar .p{font-size:13px;color:var(--ink-2);display:flex;align-items:center;gap:6px;flex-wrap:nowrap;white-space:nowrap}
.where .bar .sc{display:inline-flex;align-items:center;gap:3px;background:rgba(255,255,255,.75);border-radius:999px;padding:0 7px;font-size:12px}
.where .bar .sc svg.i{width:13px;height:13px}
.where .a{margin-inline-start:auto;font-size:16px;font-weight:600;color:var(--ink-2);white-space:nowrap}
/* رابط أسفل البطاقة */
.linkrow{display:flex;align-items:center;gap:12px;border-top:1px solid var(--line);margin:14px -18px -18px;padding:16px 18px;cursor:pointer;font-weight:600;font-size:15.5px}
.linkrow .sp{flex:1}
.linkrow svg.i{color:var(--ink-3)} .linkrow .chev{color:var(--pri)}
/* بطاقة التنبيه */
.alertcard{border:2px solid #F3C063;background:linear-gradient(180deg,#fff 60%,#FFFAF0)}
.alertcard .row{display:flex;gap:14px;align-items:flex-start}
.alertcard .ic{background:var(--warn);color:#fff;width:54px;height:54px}
.alertcard .t{font-weight:700;font-size:17px;margin-bottom:2px}
.alertcard ul{margin:6px 0 0;padding-inline-start:18px}
.alertcard li{font-size:13.5px;color:var(--ink-2);margin-bottom:4px}
.alertcard .go{color:var(--warn-ink);font-weight:700;display:inline-flex;align-items:center;gap:4px;margin-top:8px;cursor:pointer}
/* قائمة العمليات */
.day{font-size:13px;color:var(--ink-3);font-weight:600;margin:16px 6px 8px}
.txs{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:2px 16px}
.tx{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer}
.tx:last-child{border-bottom:0}
.tx .m{flex:1;min-width:0}
.tx .t{font-weight:700;font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .s{font-size:12.5px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .a{display:flex;align-items:center;gap:8px;font-weight:700;font-size:16px;white-space:nowrap}
.badges{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.b{font-size:10.5px;border-radius:7px;padding:1px 7px;background:var(--pri-soft);color:var(--pri-ink);white-space:nowrap;font-weight:500}
.b.w{background:var(--warn-soft);color:var(--warn-ink)}
.b.r{background:var(--neg-soft);color:var(--neg)}
.b.g{background:var(--pos-soft);color:var(--pos)}
.b.n{background:var(--chip);color:var(--ink-2)}
/* جداول */
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:right;vertical-align:top}
th{color:var(--ink-2);font-weight:600;font-size:12px;background:#F8F9FB}
td.n,th.n{text-align:left}
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
/* أزرار ونماذج */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;background:var(--chip);border-radius:14px;padding:10px 16px;cursor:pointer;font-weight:600;font-size:14.5px;min-height:44px;color:var(--ink)}
.btn.p{background:var(--pri);color:#fff}
.btn.g{background:var(--pos);color:#fff}
.btn.r{background:var(--neg-soft);color:var(--neg)}
.btn.w100{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btns{display:flex;gap:8px;flex-wrap:wrap}
label.f{display:block;margin:12px 0 5px;font-size:13px;color:var(--ink-2);font-weight:600}
input[type=text],input[type=number],input[type=date],input[type=search],select,textarea{width:100%;border:1px solid var(--line-2);border-radius:14px;padding:10px 12px;background:#fff;min-height:46px;font-size:16px}
input[type=search]{background:var(--chip);border-color:transparent}
textarea{min-height:74px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--pri);outline-offset:0;border-color:transparent}
.seg{display:inline-flex;background:#E9EBF1;border-radius:14px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:8px 12px;font-size:13.5px;cursor:pointer;border-radius:11px;font-weight:600;color:var(--ink-2)}
.seg button.on{background:#fff;color:var(--pri);box-shadow:0 1px 3px rgba(20,22,31,.08)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{border:0;background:var(--chip);border-radius:999px;padding:8px 14px;font-size:13.5px;white-space:nowrap;cursor:pointer;font-weight:600;color:var(--ink-2)}
.chip.on{background:var(--pri);color:#fff}
/* تنبيهات */
.banner{border-radius:18px;padding:12px 14px;margin-bottom:10px;font-size:13.5px;display:flex;gap:10px;align-items:flex-start}
.banner .x{margin-inline-start:auto;background:none;border:0;font-size:20px;line-height:1;cursor:pointer;color:inherit;opacity:.6}
.banner.w{background:var(--warn-soft);color:#5C3D00}
.banner.i{background:var(--pri-soft);color:var(--pri-ink)}
.banner.r{background:var(--neg-soft);color:#7A1A12}
.banner.g{background:var(--pos-soft);color:#0B5A32}
.hero + .banner, .hero ~ .banner{margin-top:10px}
.list .it{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer}
.list .it:last-child{border-bottom:0}
.list .it .m{flex:1;min-width:0}
.list .it .t{font-weight:700;font-size:15px}
.list .it .s{font-size:12.5px;color:var(--ink-3)}
.list .it .chev{color:var(--pri)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;font-size:14px}
.kv dt{color:var(--ink-2)} .kv dd{margin:0;font-weight:600;word-break:break-word}
.pseg{margin-top:10px} .pseg .raw{margin-top:4px}
.raw{background:#F7F8FA;border-radius:12px;padding:10px;font-size:12.5px;color:var(--ink-2);direction:rtl;word-break:break-word;white-space:pre-wrap}
.empty{text-align:center;padding:30px 12px;color:var(--ink-3)}
.empty .btn{margin-top:12px}
/* النوافذ السفلية */
.sheet-bg{position:fixed;inset:0;background:rgba(14,18,30,.42);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fade .15s ease-out}
#sheet2 .sheet-bg{z-index:55}
.sheet{background:#fff;width:100%;max-width:640px;max-height:90vh;overflow:auto;border-radius:30px 30px 0 0;padding:18px 18px calc(22px + var(--safe-b));-webkit-overflow-scrolling:touch;animation:up .2s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@media (min-width:700px){ .sheet-bg{align-items:center} .sheet{border-radius:30px;max-height:86vh} }
.sheet h3{margin:0 0 12px;font-size:17px;display:flex;align-items:center;gap:8px}
.sheet h3 .sp{flex:1}
.sheet .close{background:var(--chip);border:0;border-radius:50%;width:34px;height:34px;font-size:18px;cursor:pointer;color:var(--ink-2)}
/* رأس العملية */
.txh{text-align:center;padding:4px 0 16px;border-bottom:1px solid var(--line);margin-bottom:6px}
.txh .catbtn{margin:0 auto 14px}
.txh .nm{display:flex;align-items:center;justify-content:center;gap:10px;font-weight:700;font-size:19px}
.txh .amt{font-size:32px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:10px;margin-top:6px}
.txh .when{font-size:13px;color:var(--ink-3)}
.drow{display:flex;align-items:center;gap:14px;padding:13px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.drow:last-child{border-bottom:0}
.drow svg.i{color:var(--ink-3)}
.drow .m{flex:1;min-width:0;color:var(--ink-2)}
.drow input,.drow textarea{border:0;padding:0;min-height:0;background:none;font-size:15px}
.drow input:focus,.drow textarea:focus{outline:0}
.more{margin-top:10px}
.more summary{cursor:pointer;color:var(--pri-ink);font-weight:600;padding:10px 0;list-style:none}
.more summary::-webkit-details-marker{display:none}
/* اختيار التصنيف */
.catbtn{display:inline-flex;align-items:center;gap:8px;border:2px solid var(--line-2);background:#fff;border-radius:999px;padding:8px 16px;font-weight:700;font-size:15px;cursor:pointer;color:var(--ink)}
.catbtn svg.i{width:20px;height:20px}
.catgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.catgrid button{border:1px solid var(--line);background:#fff;border-radius:22px;padding:12px 6px;display:flex;align-items:center;justify-content:center;gap:6px;font-weight:700;font-size:14px;cursor:pointer;min-height:60px;box-shadow:0 2px 8px rgba(20,22,31,.05);color:var(--ink);line-height:1.25;text-align:center}
.catgrid button.on{border:2px solid var(--pri)}
.catgrid button svg.i{flex:none}
@media (max-width:360px){ .catgrid{grid-template-columns:repeat(2,1fr)} }
.subpick{text-align:center;padding:8px 0}
.subpick .sel{display:inline-flex;align-items:center;gap:8px;margin-bottom:16px}
.subpick .chips2{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.subpick .chips2 button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 16px;font-weight:600;font-size:14.5px;cursor:pointer;box-shadow:0 2px 8px rgba(20,22,31,.05);display:inline-flex;align-items:center;gap:6px}
.subpick .chips2 button.on{border:2px solid var(--pri);color:var(--pri-ink)}
.catfield{display:flex;align-items:center;gap:10px;width:100%;border:1px solid var(--line-2);border-radius:14px;background:#fff;padding:8px 12px;min-height:50px;cursor:pointer;font-weight:600;text-align:start}
.catfield .sp{flex:1}
.toast{position:fixed;bottom:calc(100px + var(--safe-b));left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:14px;padding:11px 16px;font-size:14px;z-index:60;max-width:90vw;box-shadow:0 8px 24px rgba(0,0,0,.2)}
.toast{display:flex;align-items:center;gap:12px}
.toast .tbtn{background:none;border:0;color:#9DB0FF;font-weight:700;font-size:14px;cursor:pointer;padding:0}
.ibres{margin-top:12px;font-size:13.5px}
.ibres .st{display:flex;gap:10px;align-items:baseline;padding:7px 0;border-bottom:1px solid var(--line)}
.ibres .st b{min-width:52px;direction:ltr;text-align:left}
.ibres .ok{color:var(--pos)} .ibres .no{color:var(--neg)}
.cnt{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--neg);color:#fff;font-size:11.5px;font-weight:700;vertical-align:middle}
.hero .tools .cnt{position:absolute;top:-4px;inset-inline-start:-4px}
/* التحديد الجماعي */
.tx .ck{width:24px;height:24px;border-radius:50%;border:2px solid var(--line-2);display:flex;align-items:center;justify-content:center;flex:none;font-size:14px;color:#fff;font-weight:700}
.tx.sel .ck{background:var(--pri);border-color:var(--pri)}
.tx.sel{background:var(--pri-soft);margin:0 -16px;padding-inline:16px}
.selbar{position:fixed;left:12px;right:12px;bottom:calc(84px + var(--safe-b));max-width:620px;margin:0 auto;z-index:32;background:#fff;border-radius:22px;box-shadow:0 10px 30px rgba(20,22,31,.18);padding:10px 12px}
.selbar .sc{font-size:13.5px;margin-bottom:8px}
.selbar .sc a{margin-inline-start:8px}
.selbar .sb{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.selbar .sb .btn{min-height:38px;padding:6px 12px;font-size:13.5px;white-space:nowrap}
body.v-txs.selmode{padding-bottom:calc(190px + var(--safe-b))}
/* المراجعة */
.rv{border:1px solid var(--line);border-radius:18px;padding:12px 14px;margin-bottom:12px}
.rv .rvh{display:flex;align-items:center;gap:8px}
.kvbox{background:#F7F8FA;border-radius:12px;padding:8px 10px}
/* تعليم الصيغة */
.fchips{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 10px}
.fchip{border:2px solid var(--line);background:#fff;border-radius:14px;padding:6px 10px;font-weight:700;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:6px;max-width:100%}
.fchip .dot{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none}
.fchip .v{font-weight:500;color:var(--ink-2);max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fchip.on{border-color:var(--c);background:#fff;box-shadow:0 0 0 3px rgba(75,92,240,.12)}
.toks{background:#F7F8FA;border-radius:14px;padding:10px;direction:rtl}
.tline{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:6px}
.tok{border:1.5px solid transparent;background:#fff;border-radius:8px;padding:3px 7px;font-size:14px;cursor:pointer;unicode-bidi:plaintext}
/* الحدود */
.lim{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.lim:last-of-type{border-bottom:0}
.lim .m{flex:1;min-width:0}
.lim .lt{display:flex;align-items:center;gap:6px}
.lim .lt .sp{flex:1}
.lim .track{height:9px;background:var(--chip);border-radius:6px;overflow:hidden;margin:6px 0 3px}
.lim .track div{height:100%;border-radius:6px}
.hide{display:none!important}
.drop{border:2px dashed var(--line-2);border-radius:var(--r-s);padding:24px 14px;text-align:center;background:#FAFBFD;cursor:pointer}
.drop:active{background:var(--pri-soft)}
.teach td,.teach th{font-size:11.5px;white-space:nowrap;max-width:160px;overflow:hidden;text-overflow:ellipsis}
.teach tr.hl td{background:#FFF7DD}
.pair{border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:10px}
.pair .cmp2{display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:12.5px;margin:6px 0 8px}
.pair .cmp2 div{background:#F7F8FA;border-radius:10px;padding:6px 8px}
.prose h3{font-size:15.5px;margin:18px 0 6px}
.prose p,.prose li{font-size:14px;color:var(--ink)}
/* التقرير والطباعة */
.report{background:#fff;border-radius:var(--r);padding:20px}
.report h1{font-size:21px;margin:0 0 2px;color:var(--ink)}
.report h2{font-size:15px;color:var(--pri-ink);border-bottom:2px solid var(--pri);padding-bottom:4px;margin:18px 0 8px}
.report .rk{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.report .rk>div{border:1px solid var(--line);border-radius:12px;padding:8px}
.report .rk .l{font-size:11.5px;color:var(--ink-2)} .report .rk .v{font-size:17px;font-weight:700}
@media print{
  @page{size:A4;margin:14mm 12mm}
  html,body{background:#fff!important;padding:0;min-height:0;font-size:12px}
  .top,.nav,.fab,.noprint,.banner,.toast,.sheet-bg{display:none!important}
  main{padding:0;max-width:none}
  .report{padding:0;border-radius:0;box-shadow:none}
  .report h2{break-after:avoid}
  table{font-size:11px} tr{break-inside:avoid}
  .card{box-shadow:none;border:1px solid var(--line)}
}
</style>
</head>
<body>
<header class="top" id="top"><div class="ttl"><button class="back hide" id="backBtn" data-action="back" aria-label="رجوع"><svg class="i" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button><h1 id="title">المدير المالي</h1><button class="back hide" id="undoBtn" data-action="undo" aria-label="تراجع" title="تراجع" style="font-size:20px">↶</button><button class="pill hide" id="periodBtn" data-action="pickPeriod"></button></div></header>
<main id="main"><div class="empty">جاري التحميل…</div></main>
<button class="fab" id="fab" data-action="go" data-view="add" aria-label="إضافة"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
<nav class="nav" id="nav">
  <button data-action="go" data-view="home"><svg viewBox="0 0 24 24"><path d="M4 10.5L12 4l8 6.5V20a1 1 0 0 1-1 1h-4v-6h-6v6H5a1 1 0 0 1-1-1z"/></svg><span>الرئيسية</span></button>
  <button data-action="go" data-view="spend"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="M8 16v-5M12 16V8M16 16v-3"/></svg><span>صرفياتك</span></button>
  <button data-action="go" data-view="txs"><svg viewBox="0 0 24 24"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6M9 16h3"/></svg><span>العمليات</span></button>
  <button data-action="go" data-view="accounts"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="M3 10h18M7 15h3"/></svg><span>الحسابات</span></button>
  <button data-action="go" data-view="more"><svg viewBox="0 0 24 24"><circle cx="7" cy="7" r="2.3"/><circle cx="17" cy="7" r="2.3"/><circle cx="7" cy="17" r="2.3"/><circle cx="17" cy="17" r="2.3"/></svg><span>المزيد</span></button>
</nav>
<div id="sheet"></div>
<div id="sheet2"></div>

<input type="file" id="restoreInput" class="hide" accept=".json,application/json">
